<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>El Peruano - Buscador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 20px; }
        .result-card { margin-bottom: 15px; border-left: 5px solid #0d6efd; }
    </style>
</head>
<body>
    <div class="container bg-white p-4 rounded shadow-sm">
        <h2 class="mb-4">Buscador de Normas Legales</h2>
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Desde</label>
                <input type="date" id="startDate" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Hasta</label>
                <input type="date" id="endDate" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Palabras clave</label>
                <input type="text" id="terms" class="form-control" placeholder="Ej: congreso desarrollo">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button onclick="buscar()" id="btnBuscar" class="btn btn-primary w-100">Buscar</button>
            </div>
        </div>

        <hr>
        <div id="loading" class="text-center d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Realizando la búsqueda... por favor espera.</p>
        </div>
        <div id="resultados"></div>
        <nav id="paginacion" class="d-none mt-3" aria-label="Paginación de resultados">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <p class="mb-0 small text-muted" id="infoPagina"></p>
                <ul class="pagination mb-0" id="paginationControls"></ul>
            </div>
        </nav>
    </div>

    <script>
        const RESULTADOS_POR_PAGINA = 10;
        let todosLosResultados = [];
        let paginaActual = 1;

        document.addEventListener('DOMContentLoaded', () => {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = hoy;
            document.getElementById('endDate').value = hoy;
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderizarResultados() {
            const resDiv = document.getElementById('resultados');
            const nav = document.getElementById('paginacion');
            const totalPaginas = Math.ceil(todosLosResultados.length / RESULTADOS_POR_PAGINA);
            const inicio = (paginaActual - 1) * RESULTADOS_POR_PAGINA;
            const fin = inicio + RESULTADOS_POR_PAGINA;
            const itemsPagina = todosLosResultados.slice(inicio, fin);

            resDiv.innerHTML = itemsPagina.map(item => `
                <div class="card result-card shadow-sm">
                    <div class="card-body">
                        <h6 class="text-primary">${escapeHtml(item.organization)}</h6>
                        <h5 class="card-title">${escapeHtml(item.title)}</h5>
                        <p class="card-text small text-muted">${escapeHtml(item.summary)}</p>
                        <a href="${escapeHtml(item.pdfLink)}" target="_blank" class="btn btn-sm btn-outline-danger">Descargar PDF</a>
                    </div>
                </div>`).join('');

            if (totalPaginas <= 1) {
                nav.classList.add('d-none');
                return;
            }
            nav.classList.remove('d-none');

            document.getElementById('infoPagina').textContent =
                `Mostrando ${inicio + 1}-${Math.min(fin, todosLosResultados.length)} de ${todosLosResultados.length} resultados (página ${paginaActual} de ${totalPaginas})`;

            const controls = document.getElementById('paginationControls');
            controls.innerHTML = `
                <li class="page-item ${paginaActual === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="prev" aria-label="Anterior">Anterior</a>
                </li>
                ${Array.from({ length: totalPaginas }, (_, i) => i + 1).map(n => `
                    <li class="page-item ${n === paginaActual ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${n}">${n}</a>
                    </li>
                `).join('')}
                <li class="page-item ${paginaActual === totalPaginas ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="next" aria-label="Siguiente">Siguiente</a>
                </li>`;

            controls.querySelectorAll('a[data-page]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (link.closest('.page-item').classList.contains('disabled')) return;
                    const page = link.getAttribute('data-page');
                    if (page === 'prev') paginaActual = Math.max(1, paginaActual - 1);
                    else if (page === 'next') paginaActual = Math.min(totalPaginas, paginaActual + 1);
                    else paginaActual = parseInt(page, 10);
                    renderizarResultados();
                });
            });
        }

        async function buscar() {
            const btn = document.getElementById('btnBuscar');
            const resDiv = document.getElementById('resultados');
            const loader = document.getElementById('loading');
            const nav = document.getElementById('paginacion');

            const rawStart = document.getElementById('startDate').value;
            const rawEnd = document.getElementById('endDate').value;
            const terms = document.getElementById('terms').value;

            const format = (dateStr) => {
                if (!dateStr) return "";
                const [y, m, d] = dateStr.split('-');
                return `${d}/${m}/${y}`;
            };

            const start = format(rawStart);
            const end = format(rawEnd);

            btn.disabled = true;
            loader.classList.remove('d-none');
            resDiv.innerHTML = '';
            nav.classList.add('d-none');
            todosLosResultados = [];
            paginaActual = 1;

            try {
                const response = await fetch(`/api/getInfo?startDate=${start}&endDate=${end}&terms=${terms}`);
                const json = await response.json();

                if (!json.success || !json.data || json.data.length === 0) {
                    resDiv.innerHTML = '<div class="alert alert-warning">No se encontraron resultados.</div>';
                    return;
                }
                todosLosResultados = json.data;
                renderizarResultados();
            } catch (e) {
                resDiv.innerHTML = '<div class="alert alert-danger">Error conectando con el servidor.</div>';
            } finally {
                btn.disabled = false;
                loader.classList.add('d-none');
            }
        }
    </script>
</body>
</html>
