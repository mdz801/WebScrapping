<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>El Peruano - Buscador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 20px; }
        .result-card { margin-bottom: 15px; border-left: 5px solid #0d6efd; }
    </style>
</head>
<body>
    <div class="container bg-white p-4 rounded shadow-sm">
        <h2 class="mb-4">Buscador de Normas Legales</h2>
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Desde</label>
                <input type="date" id="startDate" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Hasta</label>
                <input type="date" id="endDate" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Palabras clave</label>
                <input type="text" id="terms" class="form-control" placeholder="Ej: congreso desarrollo">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button onclick="buscar()" id="btnBuscar" class="btn btn-primary w-100">Buscar</button>
            </div>
        </div>

        <hr>
        <div id="loading" class="text-center d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Realizando la búsqueda... por favor espera.</p>
        </div>
        <div id="resultados"></div>
        <nav id="paginacion" class="mt-3 d-none" aria-label="Paginación de resultados">
            <ul class="pagination justify-content-center flex-wrap"></ul>
        </nav>
    </div>

    <script>
        const RESULTADOS_POR_PAGINA = 10;
        let todosLosResultados = [];
        let paginaActual = 1;

        document.addEventListener('DOMContentLoaded', () => {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = hoy;
            document.getElementById('endDate').value = hoy;

            // Despertar servicio en Render (cold start)
            fetch('/api/health').catch(() => {});

            document.getElementById('paginacion').addEventListener('click', (e) => {
                e.preventDefault();
                const a = e.target.closest('a[data-pagina]');
                if (!a || a.parentElement.classList.contains('disabled')) return;
                const p = parseInt(a.dataset.pagina, 10);
                const total = totalPaginas();
                if (p >= 1 && p <= total) {
                    paginaActual = p;
                    mostrarPagina(paginaActual);
                }
            });
        });

        function renderizarPagina(items) {
            return items.map(item => {
                const pdfButton = item.pdfLink 
                    ? `<a href="${item.pdfLink}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-danger">Ver / Descargar</a>`
                    : `<span class="text-muted small">PDF no disponible</span>`;
                
                return `
                <div class="card result-card shadow-sm">
                    <div class="card-body">
                        ${item.organization ? `<h6 class="text-primary">${item.organization}</h6>` : ''}
                        <h5 class="card-title">${item.title}</h5>
                        <p class="card-text small"><strong>Fecha:</strong> ${item.date || 'No disponible'}</p>
                        ${item.summary ? `<p class="card-text small text-muted">${item.summary}</p>` : ''}
                        ${pdfButton}
                    </div>
                </div>`;
            }).join('');
        }

        function obtenerItemsPagina(data, pagina) {
            const inicio = (pagina - 1) * RESULTADOS_POR_PAGINA;
            return data.slice(inicio, inicio + RESULTADOS_POR_PAGINA);
        }

        function totalPaginas() {
            return Math.ceil(todosLosResultados.length / RESULTADOS_POR_PAGINA) || 1;
        }

        function dibujarPaginacion() {
            const nav = document.getElementById('paginacion');
            const ul = nav.querySelector('ul');
            ul.innerHTML = '';
            const total = totalPaginas();
            if (total <= 1) {
                nav.classList.add('d-none');
                return;
            }
            nav.classList.remove('d-none');

            const fragment = document.createDocumentFragment();

            const liPrev = document.createElement('li');
            liPrev.className = `page-item ${paginaActual === 1 ? 'disabled' : ''}`;
            liPrev.innerHTML = `<a class="page-link" href="#" data-pagina="${paginaActual - 1}">Anterior</a>`;
            fragment.appendChild(liPrev);

            const maxBotones = 5;
            let desde = Math.max(1, paginaActual - Math.floor(maxBotones / 2));
            let hasta = Math.min(total, desde + maxBotones - 1);
            if (hasta - desde + 1 < maxBotones) desde = Math.max(1, hasta - maxBotones + 1);

            for (let i = desde; i <= hasta; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === paginaActual ? 'active' : ''}`;
                li.innerHTML = `<a class="page-link" href="#" data-pagina="${i}">${i}</a>`;
                fragment.appendChild(li);
            }

            const liNext = document.createElement('li');
            liNext.className = `page-item ${paginaActual === total ? 'disabled' : ''}`;
            liNext.innerHTML = `<a class="page-link" href="#" data-pagina="${paginaActual + 1}">Siguiente</a>`;
            fragment.appendChild(liNext);

            ul.appendChild(fragment);
        }

        function mostrarPagina(pagina) {
            const resDiv = document.getElementById('resultados');
            const items = obtenerItemsPagina(todosLosResultados, pagina);
            resDiv.innerHTML = renderizarPagina(items);
            dibujarPaginacion();
        }

        async function buscar() {
            const btn = document.getElementById('btnBuscar');
            const resDiv = document.getElementById('resultados');
            const loader = document.getElementById('loading');
            const nav = document.getElementById('paginacion');

            const rawStart = document.getElementById('startDate').value;
            const rawEnd = document.getElementById('endDate').value;
            const terms = document.getElementById('terms').value;

            const format = (dateStr) => {
                if(!dateStr) return "";
                const [y, m, d] = dateStr.split('-');
                return `${d}/${m}/${y}`;
            };

            const start = format(rawStart);
            const end = format(rawEnd);

            btn.disabled = true;
            loader.classList.remove('d-none');
            resDiv.innerHTML = '';
            nav.classList.add('d-none');

            try {
                const qs = new URLSearchParams({
                    startDate: start,
                    endDate: end,
                    terms: terms || ''
                });
                const response = await fetch(`/api/getInfo?${qs.toString()}`);
                const raw = await response.text();
                let json;
                try {
                    json = JSON.parse(raw);
                } catch {
                    throw new Error(
                        `El hosting respondió ${response.status} sin JSON (posible timeout/cold start o 502). ` +
                        `Espera ~30s y reintenta. Detalle: ${raw.slice(0, 120)}`
                    );
                }

                if (!response.ok) {
                    const msg = json.message || json.hint || 'Error en el servidor.';
                    resDiv.innerHTML = `<div class="alert alert-danger"><strong>Error:</strong> ${msg}` +
                        (json.hint ? `<br><small>${json.hint}</small>` : '') +
                        `</div>`;
                    return;
                }

                if (json.data.length === 0) {
                    const motivo = json.message || 'No se encontraron normas con esos filtros. Prueba cambiar fechas o palabras clave.';
                    resDiv.innerHTML = `<div class="alert alert-warning"><strong>Sin resultados.</strong> ${motivo}</div>`;
                } else {
                    todosLosResultados = json.data;
                    paginaActual = 1;
                    mostrarPagina(1);
                }
            } catch (e) {
                const detail = e && e.message ? e.message : 'No se pudo conectar con el servidor.';
                resDiv.innerHTML =
                    `<div class="alert alert-danger"><strong>Error de conexión:</strong> ${detail}<br>` +
                    `<small>En Render free el servicio se duerme; abre la página, espera 20–40 s y vuelve a Buscar. ` +
                    `También puede fallar si El Peruano bloquea la IP del servidor.</small></div>`;
            } finally {
                btn.disabled = false;
                loader.classList.add('d-none');
            }
        }
    </script>
</body>
</html>
